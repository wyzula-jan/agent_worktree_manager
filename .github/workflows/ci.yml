name: CI
on:
  push:
    # main runs this workflow through publish.yml before any release decision.
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev,release]'
      - run: python -m pytest tests/test_release.py
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: secondary
        with:
          python-version: '3.12'
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python -m pip download --dest .release-check/wheels dist/*.whl
      - run: python -m pytest --durations=10
        env:
          AWM_TEST_WHEELHOUSE: ${{ github.workspace }}/.release-check/wheels
          AWM_TEST_SECOND_PYTHON: ${{ steps.secondary.outputs.python-path }}
  conda:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: tool
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: awm-test-base
          python-version: '3.12'
      - name: Native conda round trip
        shell: bash -el {0}
        run: AWM_TEST_CONDA_BASE="$CONDA_PREFIX" "$TOOL_PYTHON" -m pytest tests/test_conda.py
        env:
          TOOL_PYTHON: ${{ steps.tool.outputs.python-path }}
