[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-worktree-manager"
version = "0.2.0"
description = "Manage isolated Python environments and Git worktrees across projects"
authors = [{name = "Jan Wyzula"}]
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "packaging>=23",
  "platformdirs>=3",
  "pip>=23.1",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console :: Curses",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2", "twine>=5", "ruff>=0.9"]
release = ["python-semantic-release==10.6.2", "build>=1.2", "twine>=5"]

[project.scripts]
awm = "agent_worktree_manager.cli:main"

[tool.setuptools]
packages = ["agent_worktree_manager"]
include-package-data = false

[tool.setuptools.package-data]
agent_worktree_manager = ["skills/awm/SKILL.md", "skills/awm/agents/openai.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: exercises real Git repositories and Python environments", "conda: requires an installed conda executable"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["agent_worktree_manager/__init__.py:__version__"]
build_command = "python -m build && python -m twine check --strict dist/*"
commit_message = "chore(release): {version} [skip ci]"
tag_format = "v{version}"
allow_zero_version = true
major_on_zero = false

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "style", "refactor", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
default_bump_level = 0

[tool.semantic_release.remote]
name = "origin"
type = "github"
ignore_token_for_push = true
token = { env = "GH_TOKEN" }
